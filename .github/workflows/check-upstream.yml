name: Monthly upstream documentation check

on:
  schedule:
    # Every month on day 1, 09:23 Asia/Shanghai (01:23 UTC).
    - cron: '23 1 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monthly-upstream-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test comparison rules
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Compare accepted translations with current upstream
        run: python scripts/check_upstream.py
      - name: Upload Markdown and JSON reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-documentation-report
          path: reports/
          if-no-files-found: error
          retention-days: 90
